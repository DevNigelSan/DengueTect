<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}DengueTect{% endblock %} — Marikina CHO</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231A56A0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M22 12h-4l-3 9L9 3l-3 9H2'/></svg>"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/globals.css') }}"/>
  {% block styles %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}

  <!-- Delete Confirmation Modal (global) -->
  <div class="delete-modal-overlay" id="deleteOverlay" style="display:none;">
    <div class="delete-modal">
      <div class="delete-modal-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6"/><path d="M14 11v6"/>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
      </div>
      <div class="delete-modal-title">Remove Forecast</div>
      <div class="delete-modal-desc">Are you sure you want to remove this forecast record? This action cannot be undone.</div>
      <div class="delete-modal-actions">
        <button class="delete-modal-cancel" onclick="hideDeleteConfirm()">Cancel</button>
        <button class="delete-modal-confirm" id="deleteConfirmBtn">Yes, Remove</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/delete-modal.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
